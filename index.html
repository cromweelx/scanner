<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Szkenner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1724">
<meta name="color-scheme" content="dark">
<title>Token Szkenner</title>
<style>
:root{--bg:#0f1724;--card:#172236;--line:#26354f;--tx:#e8eef7;--mut:#8a9bb5;--ac:#7cc4ff;--ok:#7ee2a8;--warn:#ffb86b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;color:#06121f;background:var(--ac);font-weight:700;width:100%}
button.stop{background:var(--warn)}
button.sm{width:auto;padding:8px 12px;font-size:13px;background:var(--line);color:var(--tx);font-weight:600}
#status{color:var(--mut);font-size:13px;margin:10px 2px 14px;min-height:18px}
details{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:12px}
summary{padding:11px 0;font-weight:600;cursor:pointer}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
input[type=number],input[type=text]{width:120px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;text-align:right}
input[type=text]{width:100%;margin-top:6px;text-align:left}
.col{display:block}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--ok)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-size:18px;font-weight:800}
.nm{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0;font-size:14px}
.grid span{color:var(--mut)}
.chips{margin:4px 0 10px}
.chip{display:inline-block;background:var(--line);border-radius:20px;padding:2px 10px;font-size:12px;margin:0 6px 4px 0}
.row{display:flex;gap:8px}
a.btn{flex:1;text-align:center;text-decoration:none;color:var(--tx);background:var(--line);border-radius:10px;padding:9px;font-size:13px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.foot{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<h1>Token Szkenner</h1>
<p class="sub">Solana · új tokenek · élő szűrés</p>

<button id="go">Indítás</button>
<div id="status">Készen áll.</div>

<details>
  <summary>Szűrők</summary>
  <div id="fields"></div>
  <label class="col">Narratíva kulcsszavak (vesszővel)<input type="text" id="narr"></label>
  <label>Csak narratíva-találat<input type="checkbox" id="reqNarr"></label>
  <label>Holder/rug ellenőrzés (RugCheck)<input type="checkbox" id="useRug"></label>
  <label style="border-top:0"><span></span><button class="sm" id="reset">Alaphelyzet</button></label>
</details>

<div id="out"><div class="empty">Nyomd meg az Indítást. A szűrőn átjutó tokenek itt jelennek meg.</div></div>
<p class="foot">Csak szűrő, nem pénzügyi tanács. A találatokat ellenőrizd kézzel is.</p>

<script>
const DEX="https://api.dexscreener.com", RUG="https://api.rugcheck.xyz/v1", POLL=30000;
const DEF={minLiq:15000,minVol:30000,minAge:10,maxAge:24,minBuy:45,maxTop10:40,minHolders:150,
 narr:"ai, agent, trump, dog, cat, frog, pepe, meme, gaming, defi, depin, rwa, anime",reqNarr:false,useRug:true};
const FIELDS=[["minLiq","Min. likviditás ($)"],["minVol","Min. 24h volumen ($)"],["minAge","Min. kor (perc)"],
 ["maxAge","Max. kor (óra)"],["minBuy","Min. vétel-arány 1h (%)"],["maxTop10","Max. top10 holder (%)"],["minHolders","Min. holderszám"]];
let cfg={...DEF};
try{cfg={...DEF,...JSON.parse(localStorage.getItem("cfg")||"{}")}}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(Math.round(n||0));

function drawFields(){
  $("fields").innerHTML=FIELDS.map(([k,l])=>`<label>${l}<input type="number" inputmode="decimal" data-k="${k}" value="${cfg[k]}"></label>`).join("");
  $("narr").value=cfg.narr;$("reqNarr").checked=cfg.reqNarr;$("useRug").checked=cfg.useRug;
}
function readCfg(){
  document.querySelectorAll("[data-k]").forEach(i=>{const v=parseFloat(i.value);if(!isNaN(v))cfg[i.dataset.k]=v});
  cfg.narr=$("narr").value;cfg.reqNarr=$("reqNarr").checked;cfg.useRug=$("useRug").checked;
  try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch(e){}
}
document.querySelector("details").addEventListener("change",readCfg);
$("reset").onclick=()=>{cfg={...DEF};try{localStorage.removeItem("cfg")}catch(e){}drawFields()};
drawFields();

async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}

async function candidates(){
  const out={};
  for(const p of ["/token-profiles/latest/v1","/token-boosts/latest/v1"]){
    try{for(const i of await jget(DEX+p))
      if(i.chainId==="solana"&&i.tokenAddress&&!(i.tokenAddress in out))out[i.tokenAddress]=i.description||""}catch(e){}
  }
  return out;
}
async function pairsFor(mints){
  const best={};
  for(let i=0;i<mints.length;i+=30){
    try{
      let d=await jget(`${DEX}/tokens/v1/solana/${mints.slice(i,i+30).join(",")}`);
      if(!Array.isArray(d))d=d.pairs||[];
      for(const p of d){
        const a=p.baseToken&&p.baseToken.address,l=(p.liquidity&&p.liquidity.usd)||0;
        if(a&&(!best[a]||l>=((best[a].liquidity||{}).usd||0)))best[a]=p;
      }
    }catch(e){}
  }
  return best;
}
let rugFail=false;
async function rug(m){
  try{
    const d=await jget(`${RUG}/tokens/${m}/report`);
    const top10=(d.topHolders||[]).slice(0,10).reduce((s,h)=>s+(h.pct||0),0);
    return{holders:d.totalHolders,top10,danger:(d.risks||[]).filter(r=>r.level==="danger").map(r=>r.name)};
  }catch(e){rugFail=true;return null}
}
function hits(p,desc){
  const b=p.baseToken||{},t=`${b.name||""} ${b.symbol||""} ${desc}`.toLowerCase();
  return cfg.narr.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean)
    .filter(k=>k.length>3?t.includes(k):new RegExp(`(^|[^a-z0-9])${k.replace(/[^a-z0-9]/g,"")}([^a-z0-9]|$)`).test(t));
}
async function evaluate(m,p,desc){
  const liq=(p.liquidity||{}).usd||0,vol=(p.volume||{}).h24||0;
  const age=p.pairCreatedAt?(Date.now()-p.pairCreatedAt)/60000:null;
  if(age!==null&&age<cfg.minAge)return["wait"];
  if(age!==null&&age>cfg.maxAge*60)return["fail"];
  if(liq<cfg.minLiq||vol<cfg.minVol)return["fail"];
  const h1=(p.txns||{}).h1||{},b=h1.buys||0,s=h1.sells||0,ratio=b+s?b/(b+s):0;
  if(ratio*100<cfg.minBuy)return["fail"];
  const h=hits(p,desc);
  if(cfg.reqNarr&&!h.length)return["fail"];
  let rc=null;
  if(cfg.useRug){
    rc=await rug(m);
    if(rc){
      if(rc.danger.length||rc.top10>cfg.maxTop10)return["fail"];
      if(rc.holders!=null&&rc.holders<cfg.minHolders)return["fail"];
    }
  }
  return["pass",{liq,vol,age,ratio,h,rc}];
}
function card(m,p,r){
  const b=p.baseToken||{},rc=r.rc;
  const age=r.age==null?"?":r.age<120?Math.round(r.age)+" perc":(r.age/60).toFixed(1)+" óra";
  const el=document.createElement("div");el.className="card";
  el.innerHTML=`<div class="top"><span class="sym">$${esc(b.symbol)}</span><span class="nm">${esc(b.name)}</span></div>
  <div class="grid"><div><span>Kor</span> ${age}</div><div><span>MC</span> $${fmt(p.marketCap||p.fdv)}</div>
  <div><span>Likvid</span> $${fmt(r.liq)}</div><div><span>Vol 24h</span> $${fmt(r.vol)}</div>
  <div><span>Holder</span> ${rc&&rc.holders!=null?rc.holders:"n/a"}</div><div><span>Top10</span> ${rc?rc.top10.toFixed(1)+"%":"n/a"}</div>
  <div><span>Vétel 1h</span> ${Math.round(r.ratio*100)}%</div></div>
  <div class="chips">${r.h.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
  <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://dexscreener.com/solana/${encodeURIComponent(p.pairAddress)}">DexScreener</a>
  <a class="btn" href="#" data-ca="${esc(m)}">CA másolása</a></div>`;
  el.querySelector("[data-ca]").onclick=async e=>{
    e.preventDefault();const t=e.target;
    try{await navigator.clipboard.writeText(m)}catch(x){const i=document.createElement("input");i.value=m;document.body.appendChild(i);i.select();document.execCommand("copy");i.remove()}
    t.textContent="Másolva";setTimeout(()=>t.textContent="CA másolása",1500);
  };
  return el;
}

let timer=null,running=false,done=new Set(),found=0,checked=0;
async function cycle(){
  if(!running)return;
  $("status").textContent="Keresés…";
  const c=await candidates(),todo=Object.keys(c).filter(m=>!done.has(m));
  const pairs=todo.length?await pairsFor(todo):{};
  for(const m of todo){
    const p=pairs[m];if(!p)continue;
    const [st,r]=await evaluate(m,p,c[m]);
    if(st==="wait")continue;
    done.add(m);checked++;
    if(st==="pass"){
      found++;
      if(found===1)$("out").innerHTML="";
      $("out").prepend(card(m,p,r));
      if(navigator.vibrate)navigator.vibrate(120);
    }
  }
  const t=new Date().toLocaleTimeString("hu-HU");
  $("status").textContent=`Fut · frissítve ${t} · ellenőrzött: ${checked} · találat: ${found}`+
    (rugFail?" · RugCheck nem elérhető, holder-szűrés kimarad":"");
  timer=setTimeout(cycle,POLL);
}
$("go").onclick=()=>{
  readCfg();
  running=!running;
  $("go").textContent=running?"Leállítás":"Indítás";
  $("go").classList.toggle("stop",running);
  if(running){rugFail=false;cycle()}else{clearTimeout(timer);$("status").textContent="Leállítva."}
};
</script>
</body>
</html>
